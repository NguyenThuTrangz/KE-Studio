<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KE Studio">
<title>KE Studio</title>
<link rel="icon" href="/*__ICON__*/">
<link rel="apple-touch-icon" href="/*__ICON__*/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,800;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Jost:wght@400;500;600&family=Playfair+Display:wght@700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
<style>
:root { --navy:#1B2A4A; --navy-deep:#14203A; --green:#438D41; --blue:#243F93; --gold:#B98E4C; --gold-soft:#D9BD86; --cream:#FBF8F3; --cream-2:#F4EEE4; --ink:#2B2B2B; --muted:#6F675A; --line:#E7DECF; --white:#FFFFFF; --err:#B42318; }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--cream); color:var(--ink); font:15px/1.5 Jost, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { background:var(--white); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
header .in { max-width:1080px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; }
header img { height:34px; width:auto; }
header .name { font:600 22px/1 "Cormorant Garamond", Georgia, serif; color:var(--navy); border-left:1px solid var(--line); padding-left:12px; }
header .name small { display:block; font:400 12px/1.4 Jost, sans-serif; color:var(--muted); letter-spacing:.04em; }
main { max-width:1080px; margin:0 auto; padding:16px 16px 60px; }
h3 { font:600 22px/1.2 "Cormorant Garamond", Georgia, serif; color:var(--navy); margin:18px 0 8px; }
.sub { color:var(--muted); font-size:13px; margin:4px 0; }
.err { color:var(--err); font-weight:500; }
.drop { display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center; text-align:center; padding:28px 16px; border:2px dashed var(--gold-soft); border-radius:14px; background:var(--white); cursor:pointer; color:var(--navy); }
.drop b { font:600 20px/1.3 "Cormorant Garamond", Georgia, serif; }
.drop span { font-size:13px; color:var(--muted); }
.drop input { position:absolute; width:1px; height:1px; opacity:0; }
.drop:focus-within { outline:3px solid var(--gold); }
.strip { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
.mini { position:relative; }
.mini canvas { border-radius:8px; display:block; border:1px solid var(--line); }
.mini .x { position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%; border:0; background:var(--navy); color:#fff; cursor:pointer; line-height:1; }
.bar { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; align-items:center; }
.bar button { border:1px solid var(--line); background:var(--white); color:var(--navy); border-radius:999px; padding:7px 13px; font:500 13px Jost, sans-serif; cursor:pointer; min-height:36px; display:inline-flex; align-items:center; gap:6px; }
.bar button[aria-pressed=true] { background:var(--navy); color:#fff; border-color:var(--navy); }
.sw { width:12px; height:12px; border-radius:50%; display:inline-block; border:1px solid rgba(0,0,0,.15); }
.btn { border:0; background:var(--green); color:#fff; border-radius:10px; padding:10px 18px; font:600 15px Jost, sans-serif; cursor:pointer; min-height:44px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
.btn.line { background:var(--white); color:var(--navy); border:1px solid var(--line); }
.bar .btn { border-radius:10px; }
.tpl { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
.tile { padding:0; border:1px solid var(--line); background:var(--white); border-radius:10px; overflow:hidden; cursor:pointer; min-height:120px; }
.tile:hover { border-color:var(--gold); }
.tile canvas { width:100%; height:auto; display:block; }
.previewBox { background:var(--white); border:1px solid var(--line); border-radius:14px; padding:10px; text-align:center; }
.preview { max-width:100%; max-height:70vh; width:auto; height:auto; touch-action:none; cursor:grab; border-radius:6px; }
.card { background:var(--white); border:1px solid var(--line); border-radius:12px; padding:4px 14px; margin:10px 0; }
.card summary { font:600 18px/2.2 "Cormorant Garamond", Georgia, serif; color:var(--navy); cursor:pointer; }
.card[open] { padding-bottom:12px; }
.field { margin:10px 0; display:flex; flex-direction:column; gap:6px; }
.field label { font-weight:500; color:var(--navy); }
.txt, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font:15px Jost, sans-serif; background:var(--white); color:var(--ink); }
.range { display:grid; grid-template-columns:130px 1fr 40px; align-items:center; gap:8px; margin:8px 0; }
.range input { width:100%; accent-color:var(--green); }
.range .val { text-align:right; color:var(--muted); font-size:13px; }
.ticks label { display:flex; align-items:center; gap:6px; margin:8px 0; }
.ticks input { accent-color:var(--green); width:18px; height:18px; }
.waBox { background:var(--white); border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
.waBox .txt { max-width:320px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; }
.grid img { width:100%; border-radius:8px; border:1px solid var(--line); display:block; }
footer { text-align:center; color:var(--muted); font-size:12px; padding:20px 16px; }
@media (min-width:900px) { .editorWrap { display:grid; grid-template-columns:1.2fr 1fr; gap:16px; } }
@media (max-width:480px) { .range { grid-template-columns:100px 1fr 34px; } header img { height:28px; } header .name { font-size:18px; } }
</style>
</head>
<body>
<header><div class="in"><img src="/*__LOGO__*/" alt="K-Embroidery"><div class="name">Studio<small>Tạo ảnh đăng bài theo nhận diện K-Embroidery</small></div></div></header>
<main id="view"></main>
<footer>KE Studio · ảnh xử lý ngay trên máy, không gửi đi đâu · không dùng AI</footer>

</script>
</body>
</html>
